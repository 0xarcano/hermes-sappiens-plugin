name: sappiens-wallet
version: 0.1.0
description: Pair with Sappiens Wallet over the relay protocol; build chain proposals from bundled SKILLs (Nyx first).
author: hermes-sappiens
requires_env:
  - SAPPIENS_AGENT_ED25519_SEED
config_schema:
  relay_url:
    type: str
    default: "http://127.0.0.1:8080"
    label: "Relay URL"
    description: "Agent-reachable Sappiens relay origin (SAPPIENS_RELAY_URL)"
  advertise_relay:
    type: str
    default: ""
    label: "Advertise relay URL"
    description: "Wallet-facing relay origin sealed into the QR; leave empty to use Relay URL (SAPPIENS_ADVERTISE_RELAY)"
provides_tools:
  - sappiens_pair
  - sappiens_status
  - sappiens_skills
  - sappiens_send
  - sappiens_claim_rewards
  - sappiens_propose_raw
python_dependencies:
  - cryptography>=42,<46
  - httpx>=0.27,<1
  - cbor2>=5.4,<6
  - PyYAML>=6,<7
