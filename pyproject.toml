[build-system]
requires = ["setuptools>=68,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-sappiens-plugin"
version = "0.1.1"
description = "Hermes plugin that pairs with Sappiens Wallet and builds chain proposals from SKILLs"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "hermes-sappiens" }]
dependencies = [
  "cryptography>=42,<51",
  "httpx>=0.27,<1",
  "cbor2>=5.4,<7",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "respx>=0.21,<1",
]

[project.entry-points."hermes_agent.plugins"]
sappiens_wallet = "sappiens_hermes.plugin:register"

[tool.setuptools.packages.find]
include = ["sappiens_hermes*"]

[tool.setuptools.package-data]
sappiens_hermes = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
